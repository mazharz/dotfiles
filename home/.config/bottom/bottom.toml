[flags]
# Remove the gap between table headers and data rows.
# One of "none", "space" (default), "line".
table_gap = "none"
# Use dot for graph instead of braille
dot_marker = true

[cpu]
# Whether to put the CPU legend to the left.
left_legend = true

[processes]
# Whether to make process searching use regex by default.
regex = true
# Show memory values in the processes widget as values by default
default_memory_value = true

[memory_graph]
# Shows cache and buffer memory
cache_memory = true
# Where to place the legend for the memory widget.
# One of "none", "top-left", "top", "top-right", "left", "right", "bottom-left", "bottom", "bottom-right".
legend_position = "top-left"

[network_graph]
# Displays the network widget using bytes.
use_bytes = true
# Where to place the legend for the network widget.
# One of "none", "top-left", "top", "top-right", "left", "right", "bottom-left", "bottom", "bottom-right".
legend_position = "top-left"

[styles]
# Built-in themes. Valid values are:
# - "default"
# - "default-light"
# - "gruvbox"
# - "gruvbox-light"
# - "nord"
# - "nord-light".
#
theme = "gruvbox"

# Layout - layouts follow a pattern like this:
# [[row]] represents a row in the application.
# [[row.child]] represents either a widget or a column.
# [[row.child.child]] represents a widget.
#
# All widgets must have the type value set to one of ["cpu", "mem", "proc", "net", "temp", "disk", "empty"].
# All layout components have a ratio value - if this is not set, then it defaults to 1.
[[row]]
  ratio=85
  [[row.child]]
    ratio=30
    type="proc"
    [[row.child]]
      ratio=70
      [[row.child.child]]
        type="cpu"
      [[row.child.child]]
        type="mem"
      [[row.child.child]]
        type="net"
[[row]]
  ratio=15
  [[row.child]]
    ratio=30
    type="temp"
  [[row.child]]
    ratio=30
    type="battery"
  [[row.child]]
    ratio=40
    type="disk"
